# Renders the API reference (docs/build.py: pdoc over the module
# docstrings, with the Axiom template in docs/pdoc-template) and the
# working paper (quarto over paper/, into _site/paper/web — the site
# wraps it at axiom.org/receipt/paper), then deploys both to GitHub
# Pages; axiom.org/receipt/api and /receipt/paper/web rewrite to the
# deployment. The build makes no model calls and holds no stored
# secrets: its only privileges are the read-only checkout token and the
# Pages OIDC deployment (the posture of publish.yml). pdoc and quarto
# are pinned; project dependencies float per this repo's norm (uv.lock
# is gitignored). The paper renders before build.py so build.py's
# fail-closed sweep covers the manuscript pages too.
#
# One-time prerequisite (repo admin), before first merge to main:
#   gh api -X POST repos/TheAxiomFoundation/receipt/pages -f build_type=workflow
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize Pages deployments; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.9.36
          tinytex: true
      - run: quarto render paper --output-dir "$GITHUB_WORKSPACE/_site/paper/web"
      - run: uv run --no-dev --with pdoc==16.0.0 python docs/build.py _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
