# Renders the API reference (pdoc over the module docstrings, with the
# Axiom template in docs/pdoc-template) and deploys it to GitHub Pages;
# axiom-foundation.org/receipt/api rewrites to the deployment. The build
# is offline and deterministic: no model calls, and no credentials
# beyond the Pages OIDC deployment — the same posture as publish.yml.
#
# One-time prerequisite (repo admin), before first merge to main:
#   gh api -X POST repos/TheAxiomFoundation/receipt/pages -f build_type=workflow
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize Pages deployments; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"
      - run: uv sync --no-dev
      - run: >-
          uv run --with pdoc==16.0.0 pdoc receipt
          --docformat restructuredtext
          -t docs/pdoc-template
          --favicon https://axiom-foundation.org/favicon.svg
          -e "receipt=https://github.com/TheAxiomFoundation/receipt/blob/main/src/receipt/"
          -o _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
