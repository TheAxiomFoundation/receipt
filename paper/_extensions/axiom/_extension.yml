title: Axiom paper
author: the Axiom Foundation
version: 1.0.0
quarto-required: ">=1.7.0"
contributes:
  formats:
    common:
      number-sections: true
      metadata-files:
        - theme-axiom.yml
    pdf:
      pdf-engine: xelatex
      geometry:
        - margin=1.1in
      format-resources:
        - fonts
      colorlinks: true
      code-block-border-left: "#e5e7eb"
      code-block-bg: false
      axiom-font-dir: fonts
      template-partials:
        - partials/before-title.tex
        - partials/title.tex
        - partials/before-body.tex
    html:
      toc: true
      embed-resources: false
      code-block-bg: false
      theme:
        - default
        - axiom.scss
      css: fonts.css
      template-partials:
        - partials/title-block.html
